[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "rest-api-checker"
version = "0.1.0"
description = "Qualified OpenAPI reference oracle for a bounded bachelor thesis experiment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openapi-schema-validator==0.9.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pyodbc==5.3.0",
  "rich>=14.1,<15",
]

[project.scripts]
rest-api-checker = "rest_api_checker.cli:entrypoint"

[dependency-groups]
dev = ["pytest==9.1.1"]
sqlserver-probe = [
    "pyodbc==5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sqlserver: requires an explicitly enabled disposable Microsoft SQL Server database"]
filterwarnings = ["error"]
