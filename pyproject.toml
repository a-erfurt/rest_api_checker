[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "rest-api-checker"
version = "0.1.0"
description = "Qualified OpenAPI reference oracle for a bounded bachelor thesis experiment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openapi-schema-validator==0.9.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "pyodbc==5.3.0",
  "rich>=14.1,<15",
  "fastapi>=0.115,<0.130",
  "jinja2>=3.1.6,<4",
  "uvicorn>=0.34,<1",
  "ipykernel>=7.4.0",
]

[project.scripts]
rac = "rest_api_checker.operator:entrypoint"
rest-api-checker = "rest_api_checker.cli:entrypoint"
rest-api-checker-web = "rest_api_checker.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest==9.1.1",
]
sqlserver-probe = [
    "pyodbc==5.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sqlserver: requires an explicitly enabled disposable Microsoft SQL Server database"]
filterwarnings = ["error"]

[tool.uv]
# Starlette 0.52 TestClient uses the BlockingPortal alias deprecated in AnyIO 4.15.
constraint-dependencies = ["anyio<4.15"]
