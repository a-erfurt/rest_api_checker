[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "rest-api-checker"
version = "0.1.0"
description = "Qualified OpenAPI reference oracle for a bounded bachelor thesis experiment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openapi-schema-validator==0.9.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
