name: rac-sql-env-20260926
services:
  sqlserver:
    # Official SQL Server 2022 CU27, Ubuntu 22.04; limited local emulation probe.
    image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${RAC_SQL_PASSWORD:?Use the external private env file}
    ports:
      - "127.0.0.1:${RAC_SQL_PORT:?Choose an unused local port}:1433"
    volumes:
      - probe_data:/var/opt/mssql
    # Failures remain visible; never silently restart an incompatible engine.
    restart: "no"
volumes:
  probe_data:
